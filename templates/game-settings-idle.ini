# Place in Sys/GameSettings/<DISC-ID>.ini.
#
# Use only for a loop that repeatedly waits on a VI/audio/OS event. The
# runtime calls CoreTiming::Idle() when the dispatcher lands on this PC,
# advancing to the next scheduled event instead of spinning in host code.
#
# Find the address with STATICRECOMP_DISPATCH_SAMPLES=1, the PGO profile, or a
# debugger. Do not point this at a loop that does real work.
[Core]
StaticRecompIdlePC = 0x80000000
